<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria realizacji – ToTen Plan</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ========== GLOBAL ========= */
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Montserrat',sans-serif;
      background:#d9d9d9;
      color:#333;
      scroll-behavior:smooth;
    }
    h1,h2{margin:0}
    a{color:inherit;text-decoration:none}

    /* ========== HEADER ========= */
    .site-header{
      background:#ffffff;
      position:sticky;top:0;z-index:1000;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      padding:0 40px;
    }
    .top-bar{display:flex;align-items:center;padding:15px 0}
    .logo img{height:70px;object-fit:contain}
    .site-title{flex:1;text-align:center;font-size:22px;font-weight:600;line-height:1.3}
    .main-nav{display:flex;justify-content:center;gap:20px;padding:10px 0 18px;flex-wrap:wrap}
    .main-nav a{padding:8px 18px;font-size:14px;background:#f0f0f0;border-radius:6px;transition:.2s}
    .main-nav a:hover{background:#333;color:#fff}
    .main-nav .active{background:#333;color:#fff}

    @media(max-width:768px){
      .site-header{padding:0 20px}
      .top-bar{flex-direction:column}
      .logo img{height:55px}
      .site-title{font-size:18px;margin-top:8px}
      .main-nav{gap:12px;padding-bottom:14px}
      .main-nav a{font-size:13px;padding:7px 14px}
    }

    /* ========== HERO ========= */
    .hero{
      position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:80px 20px 60px;background:url('hero-galeria.jpg') center/cover no-repeat;color:#fff;
    }
    .hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
    .hero-content{position:relative;z-index:1;max-width:800px}
    .hero h1{font-family:'Playfair Display',serif;font-size:40px;margin-bottom:10px}
    .hero p{font-size:20px}

    /* ========== GALLERY GRID ========= */
    .gallery-section{padding:60px 20px;max-width:1300px;margin:auto}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .gallery-grid img{width:100%;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:.3s;cursor:pointer;object-fit:cover;height:100%}
    .gallery-grid img:hover{transform:scale(1.03);box-shadow:0 6px 20px rgba(0,0,0,.12)}

    /* LIGHTBOX with sub‑gallery */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:2000}
    .lightbox.active{display:flex}
    .lightbox-content{position:relative;width:90%;max-width:1000px;max-height:90%}
    .lightbox-content img{width:100%;height:auto;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
    .nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.8);border:none;border-radius:50%;width:46px;height:46px;cursor:pointer;font-size:26px;display:flex;align-items:center;justify-content:center}
    .nav-btn:hover{background:#fff}
    .prev-btn{left:-60px}
    .next-btn{right:-60px}
    .close-btn{position:absolute;top:-60px;right:0;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer}
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="top-bar">
      <a href="index.html" class="logo"><img src="logo.JPG" alt="Logo To Ten Plan"></a>
      <h1 class="site-title">ToTen Plan – design studio by Paulina Łuczak</h1>
    </div>
    <nav class="main-nav">
      <a href="index.html#o-mnie">O&nbsp;mnie</a>
      <a href="index.html#oferta">Oferta</a>
      <a href="galeria.html" class="active">Galeria</a>
      <a href="index.html#kontakt">Kontakt</a>
    </nav>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="hero-content">
      <h1>Galeria realizacji</h1>
      <p>Kliknij projekt, aby zobaczyć więcej zdjęć</p>
    </div>
  </section>

  <!-- ===== GALLERY GRID (każde zdjęcie → podgaleria) ===== -->
  <section class="gallery-section">
    <div class="gallery-grid">
      <img src="proj1.jpg" alt="Projekt 1" data-group="proj1" loading="lazy">
      <img src="gallery2.jpg" alt="Projekt 2" data-group="proj2" loading="lazy">
      <img src="gallery3.jpg" alt="Projekt 3" data-group="proj3" loading="lazy">
      <img src="gallery4.jpg" alt="Projekt 4" data-group="proj4" loading="lazy">
      <img src="gallery5.jpg" alt="Projekt 5" data-group="proj5" loading="lazy">
      <img src="gallery6.jpg" alt="Projekt 6" data-group="proj6" loading="lazy">
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="close-btn" id="closeBtn">✕</button>
      <button class="nav-btn prev-btn" id="prevBtn">❮</button>
      <img src="" alt="podgląd" id="lightboxImg">
      <button class="nav-btn next-btn" id="nextBtn">❯</button>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer style="background:#d9d9d9;text-align:center;font-size:16px;padding:30px 20px;margin-top:80px">
    © 2025 TO TEN PLAN | Projekt + Realizacja + Nadzór
  </footer>

  <!-- ===== SUB‑GALLERY SCRIPT ===== -->
  <script>
    // 1. Mapujemy grupy na tablice zdjęć (podgalerie)
    const galleries = {
      proj1: ['river1.jpg','river2.JPG','river3.JPG'],
      proj2: ['gallery2.jpg','g2_2.jpg','g3_','g2_4.jpg'],
      proj3: ['gallery3.jpg','g3_2.jpg'],
      proj4: ['gallery4.jpg','g4_2.jpg','g4_3.jpg'],
      proj5: ['gallery5.jpg','g5_2.jpg','g5_3.jpg','g5_4.jpg'],
      proj6: ['gallery6.jpg','g6_2.jpg']
    };

    // 2. Pobieramy elementy
    const thumbs = document.querySelectorAll('.gallery-grid img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const closeBtn = document.getElementById('closeBtn');

    let currentGroup = [];
    let currentIndex = 0;

    function openLightbox(groupName, startIndex){
      currentGroup = galleries[groupName];
      currentIndex = startIndex;
      showImage();
      lightbox.classList.add('active');
    }

    function showImage(){
      lightboxImg.src = currentGroup[currentIndex];
      prevBtn.style.display = currentGroup.length > 1 ? 'flex' : 'none';
      nextBtn.style.display = currentGroup.length > 1 ? 'flex' : 'none';
    }

    // 3. Podpinamy kliknięcia miniaturek
    thumbs.forEach((img,i) => {
      img.addEventListener('click', () => {
        const groupName = img.dataset.group;
        const startIndex = 0; // zawsze zaczynamy od 1. zdjęcia danego projektu
        openLightbox(groupName,startIndex);
      });
    });

    // 4. Nawigacja
    prevBtn.addEventListener('click', e => {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + currentGroup.length) % currentGroup.length;
      showImage();
    });
    nextBtn.addEventListener('click', e => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % currentGroup.length;
      showImage();
    });

    // 5. Zamknięcie lightboxa
    lightbox.addEventListener('click', close);
    closeBtn.addEventListener('click', close);
    function close(){
      lightbox.classList.remove('active');
    }
  </script>
</body>
</html>
